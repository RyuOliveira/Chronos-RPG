<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPCs - Chronos RPG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="npc-style.css">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="../index.html">
                <i class="fas fa-chevron-left me-2"></i>Portal Chronos
            </a>
            <span class="navbar-text">
                Seção de NPCs
            </span>
        </div>
    </nav>

    <div class="npc-container">
        <header class="text-center mb-5">
            <h1 class="display-4 fw-bold" style="color: var(--npc-primary)">Galeria de Personagens</h1>
            <p class="lead">Conheça os habitantes e figuras marcantes do mundo.</p>
        </header>

        <div class="row mb-4">
            <div class="col-md-6 offset-md-3">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0">
                        <i class="fas fa-search text-muted"></i>
                    </span>
                    <input type="text" id="npcSearch" class="form-control border-start-0 ps-0"
                        placeholder="Buscar por nome ou tag...">
                </div>
            </div>
        </div>

        <div id="npcList" class="row g-4">
            <!-- NPCs will be rendered here -->
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </div>

    <script src="npc-script.js"></script>
    <script>
        const npcManager = new NPCManager();
        npcManager.init('npcList', 'npcSearch');
    </script>
</body>

</html>
