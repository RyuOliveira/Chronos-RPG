<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do NPC - Chronos RPG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="npc-style.css">
</head>

<body>

    <div id="npcDetailContent">
        <!-- Rendered Content -->
        <div class="npc-container text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>

    <script src="npc-script.js"></script>
    <script>
        const npcManager = new NPCManager();
        npcManager.renderDetail('npcDetailContent');
    </script>
</body>

</html>
