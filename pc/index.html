<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heróis de Chronos - Players</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="pc-style.css">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="../index.html">
                <i class="fas fa-shield-halved me-2"></i>Portal Chronos
            </a>
            <span class="navbar-text">
                Galeria de Heróis
            </span>
        </div>
    </nav>

    <div class="pc-container">
        <header class="text-center mb-5">
            <h1 class="display-3 fw-bold animate-glow" style="color: var(--pc-secondary)">Os Heróis de Chronos</h1>
            <p class="lead">Conheça a lenda viva dos aventureiros que moldam o destino do mundo.</p>
        </header>

        <div id="pcList" class="row g-4 justify-content-center">
            <!-- PCs will be rendered here -->
            <div class="text-center py-5">
                <div class="spinner-border text-warning" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </div>

    <script src="pc-script.js"></script>
    <script>
        const pcManager = new PCManager();
        pcManager.init('pcList');
    </script>
</body>

</html>
