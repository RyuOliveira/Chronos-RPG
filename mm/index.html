<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual dos Monstros - Glossário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="mm-style.css">
</head>

<body>
    <div class="container mt-5">
        <div class="monster-card card border-danger">
            <div class="card-header bg-danger text-white d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center">
                    <a href="../index.html" class="btn btn-outline-light btn-sm me-3" title="Voltar ao Portal"><i
                            class="fas fa-home"></i></a>
                    <h2 class="h4 mb-0"><i class="fas fa-book-skull me-2"></i>Manual dos Monstros - Glossário</h2>
                </div>
                <div class="badge bg-dark text-white fs-6">D&D 5e (GitHub Edition)</div>
            </div>

            <div class="card-body">
                <p class="mb-4 text-center">Navegue pela lista de criaturas. Clique em um nome para ver a ficha
                    detalhada do monstro. Entre as entradas recentes, destaque-se o Inumano Fuliginoso Feral e o
                    Inumano Fuliginoso Psíquico.</p>

                <div id="glossary-container">
                    <div class="text-center py-5">
                        <i class="fas fa-spinner fa-spin fa-3x mb-3"></i>
                        <p>Invocando monstros...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="monstros-data.js"></script>
    <script src="mm-script.js"></script>
    <script>
        const mm = new window.MonsterManual();
        const glossaryContainer = document.getElementById('glossary-container');
        mm.load()
            .then((data) => {
                if (data) {
                    mm.renderGlossary('glossary-container');
                    return;
                }

                glossaryContainer.innerHTML = '<div class="alert alert-danger">Não foi possível carregar a lista de monstros. Abra esta página pelo servidor local do XAMPP.</div>';
            })
            .catch(() => {
                glossaryContainer.innerHTML = '<div class="alert alert-danger">Não foi possível carregar a lista de monstros. Abra esta página pelo servidor local do XAMPP.</div>';
            });
    </script>
</body>

</html>
