<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual dos Monstros - Glossário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="mm-style.css?v=20261126-1">
</head>

<body>
    <main class="monster-catalog-shell">
        <header class="catalog-topbar">
            <a href="../index.html" class="catalog-home" title="Voltar ao Portal" aria-label="Voltar ao Portal">
                <i class="fas fa-home"></i>
            </a>
            <div>
                <p class="catalog-eyebrow">Chronos RPG · D&D 5e</p>
                <h1>Manual dos Monstros</h1>
                <p class="catalog-intro">Encontre uma criatura por nome, ND ou tipo.</p>
            </div>
        </header>

        <section class="catalog-panel" aria-label="Catálogo de monstros">
            <div id="glossary-container">
                <div class="catalog-loading">
                    <i class="fas fa-spinner fa-spin" aria-hidden="true"></i>
                    <p>Carregando criaturas...</p>
                </div>
            </div>
        </section>
    </main>

    <script src="monstros-data.js?v=20261126-1"></script>
    <script src="mm-script.js?v=20261126-1"></script>
    <script>
        const mm = new window.MonsterManual();
        const glossaryContainer = document.getElementById('glossary-container');
        mm.load()
            .then((data) => {
                if (data) {
                    mm.renderGlossary('glossary-container');
                    return;
                }

                glossaryContainer.innerHTML = '<div class="alert alert-danger">Não foi possível carregar a lista de monstros. Abra esta página pelo servidor local do XAMPP.</div>';
            })
            .catch(() => {
                glossaryContainer.innerHTML = '<div class="alert alert-danger">Não foi possível carregar a lista de monstros. Abra esta página pelo servidor local do XAMPP.</div>';
            });
    </script>
</body>

</html>
