<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha da Criatura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="mm-style.css">
</head>

<body>
    <div id="monster-sheet-container" class="container mt-5 px-3">
        <div class="text-center py-5">
            <i class="fas fa-spinner fa-spin fa-3x mb-3"></i>
            <p>Conjurando criatura...</p>
        </div>
    </div>

    <script src="monstros-data.js"></script>
    <script src="mm-script.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');

        if (!slug) {
            window.location.href = 'index.html';
        } else {
            const mm = new window.MonsterManual();
            const monsterContainer = document.getElementById('monster-sheet-container');
            mm.load()
                .then((data) => {
                    if (data) {
                        mm.renderMonsterSheet(slug, 'monster-sheet-container');
                        return;
                    }

                    monsterContainer.innerHTML = '<div class="alert alert-danger mt-5">Não foi possível carregar a ficha. Abra esta página pelo servidor local do XAMPP.</div>';
                })
                .catch(() => {
                    monsterContainer.innerHTML = '<div class="alert alert-danger mt-5">Não foi possível carregar a ficha. Abra esta página pelo servidor local do XAMPP.</div>';
                });
        }
    </script>
</body>

</html>
